<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Lau's First Gemini App</title>
    <style>
        :root {
            --primary: #ff85a2;
            --secondary: #70d6ff;
            --bg: #fff5f8;
            --text: #4a4a4a;
            --correct: #4CAF50;
            --wrong: #f44336;
            --gemini: #8E75FF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #game-container {
            max-width: 500px;
            width: 90%;
            background: white;
            padding: 2rem;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: 50px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .score-box {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        h1 { color: var(--primary); margin: 0; font-size: 1.5rem; }
        
        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            min-height: 60px;
            font-weight: 600;
            line-height: 1.4;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        button {
            background: white;
            border: 2px solid var(--secondary);
            padding: 15px;
            border-radius: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            font-weight: 500;
            outline: none;
        }

        button:hover:not(.disabled) {
            background: var(--secondary);
            color: white;
        }

        button.correct {
            background-color: var(--correct) !important;
            border-color: var(--correct) !important;
            color: white !important;
        }

        button.wrong {
            background-color: var(--wrong) !important;
            border-color: var(--wrong) !important;
            color: white !important;
        }

        .disabled {
            pointer-events: none;
        }

        .hidden { display: none !important; }

        #results {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 100;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            margin-top: 20px;
            width: 100%;
        }

        .gemini-btn {
            background: var(--gemini);
            color: white;
            border: none;
            margin-top: 10px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .gemini-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #ai-feedback-container {
            margin-top: 15px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 15px;
            font-size: 0.9rem;
            text-align: left;
            border-left: 4px solid var(--gemini);
        }

        #sixty-seven-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 20px #fff, 0 0 40px #ff85a2;
            z-index: 101;
            pointer-events: none;
            display: none;
            font-family: 'Arial Black', sans-serif;
        }
        
        .try-again-callout {
            color: var(--wrong);
            font-weight: bold;
            font-size: 1.2rem;
            margin: 15px 0;
        }

        #ai-explanation {
            font-style: italic;
            color: #666;
            margin-top: 10px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>
    <div id="sixty-seven-display">67</div>

    <div id="game-container">
        <div id="quiz-view">
            <div class="header">
                <h1>Mr Lau's First Gemini App</h1>
                <div class="score-box">Points: <span id="current-score">0</span></div>
            </div>
            <div id="progress-bar" style="width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-bottom: 20px;">
                <div id="progress-fill" style="width: 0%; height: 100%; background: var(--secondary); border-radius: 4px; transition: width 0.3s;"></div>
            </div>
            <div class="question" id="question-text">Loading...</div>
            <div class="options" id="options-container"></div>
            
            <button id="explain-btn" class="gemini-btn" onclick="getAIExplanation()">✨ Explain This Question</button>
            <div id="ai-explanation" class="hidden"></div>
        </div>

        <div id="results" class="hidden">
            <h2 id="result-title">Quiz Finished!</h2>
            <p id="result-text"></p>
            <p style="font-size: 2rem; font-weight: bold;" id="result-percent"></p>
            
            <button id="ai-feedback-btn" class="gemini-btn" onclick="getAIFeedback()">✨ Get ✨ AI Feedback</button>
            <div id="ai-feedback-container" class="hidden">
                <div id="ai-feedback-content">Generating...</div>
            </div>

            <div id="try-again-message" class="try-again-callout hidden">⚠️ You need 90% to see the fireworks! Please try again.</div>
            <button class="restart-btn" onclick="restartGame()">Try Again</button>
        </div>
    </div>

    <script>
        const apiKey = ""; // Provided at runtime
        const questions = [
            { q: "What is a recount?", a: ["A story about the future", "Telling about an event that has already happened", "A list of shopping items"], correct: 1 },
            { q: "What is a 'Personal Recount'?", a: ["A story about someone else's dog", "A story about your own experience", "A set of instructions to build a toy"], correct: 1 },
            { q: "Recounts are written in 'Chronological Order'. What does this mean?", a: ["Events are told in the order they happened", "The most exciting part is told first", "The story is told backwards"], correct: 0 },
            { q: "What tense is a recount usually written in?", a: ["Future Tense (will happen)", "Present Tense (is happening)", "Past Tense (already happened)"], correct: 2 },
            { q: "Which of these is NOT an example of a recount?", a: ["A diary entry", "A story about a school trip", "A recipe for making a cake"], correct: 2 },
            { q: "A news report is an example of what?", a: ["A factual recount", "A poem", "A science fiction book"], correct: 0 },
            { q: "Which words help show Chronological Order?", a: ["Blue, Green, Red", "First, Next, Then, Finally", "Happy, Sad, Angry"], correct: 1 },
            { q: "In a personal recount, which word would you use most?", a: ["I", "They", "It"], correct: 0 },
            { q: "What is the purpose of a recount?", a: ["To argue with someone", "To inform or entertain by retelling an event", "To ask a lot of questions"], correct: 1 },
            { q: "Which of these IS a recount?", a: ["A dictionary", "A story about your summer holiday", "A math problem"], correct: 1 }
        ];

        let currentQIndex = 0;
        let score = 0;
        let isAnswering = false;

        const qText = document.getElementById('question-text');
        const optCont = document.getElementById('options-container');
        const scoreDisp = document.getElementById('current-score');
        const progressFill = document.getElementById('progress-fill');

        async function callGemini(prompt, systemPrompt = "You are a helpful teaching assistant for primary school students.") {
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            
            while (retries < 5) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (e) {
                    await new Promise(r => setTimeout(r, delays[retries]));
                    retries++;
                }
            }
            return "Sorry, I couldn't reach the AI right now. Please try again later!";
        }

        async function getAIExplanation() {
            const explainBtn = document.getElementById('explain-btn');
            const explainDiv = document.getElementById('ai-explanation');
            const currentQ = questions[currentQIndex];
            
            explainBtn.disabled = true;
            explainDiv.classList.remove('hidden');
            explainDiv.innerText = "✨ Thinking...";

            const prompt = `The student is looking at this quiz question: "${currentQ.q}". The options are: ${currentQ.a.join(', ')}. Without just giving the answer immediately, explain the concept of this question in one or two simple sentences for a primary school student.`;
            const explanation = await callGemini(prompt, "You are a friendly teacher explaining writing concepts.");
            
            explainDiv.innerText = explanation;
        }

        async function getAIFeedback() {
            const fbBtn = document.getElementById('ai-feedback-btn');
            const fbCont = document.getElementById('ai-feedback-container');
            const fbContent = document.getElementById('ai-feedback-content');
            
            fbBtn.disabled = true;
            fbCont.classList.remove('hidden');
            fbContent.innerText = "✨ Gemini is looking at your results...";

            const prompt = `A student just finished a 10-question quiz about 'Recounts' and scored ${score} out of 10. Give them a very encouraging, short, and personalized feedback message (2-3 sentences). Mention that they are using Mr Lau's Gemini App. Use fun emojis.`;
            const feedback = await callGemini(prompt);
            
            fbContent.innerText = feedback;
        }

        function loadQuestion() {
            isAnswering = false;
            document.getElementById('ai-explanation').classList.add('hidden');
            document.getElementById('explain-btn').disabled = false;
            
            const q = questions[currentQIndex];
            qText.innerText = q.q;
            optCont.innerHTML = '';
            
            q.a.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(index, btn);
                optCont.appendChild(btn);
            });

            progressFill.style.width = `${(currentQIndex / questions.length) * 100}%`;
        }

        function handleAnswer(selectedIndex, clickedBtn) {
            if (isAnswering) return;
            isAnswering = true;

            const correctIndex = questions[currentQIndex].correct;
            const allButtons = optCont.querySelectorAll('button');

            allButtons.forEach((btn, idx) => {
                btn.classList.add('disabled');
                if (idx === correctIndex) {
                    btn.classList.add('correct');
                } else if (idx === selectedIndex) {
                    btn.classList.add('wrong');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                scoreDisp.innerText = score;
            }

            setTimeout(() => {
                currentQIndex++;
                if (currentQIndex < questions.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }

        function showResults() {
            document.getElementById('quiz-view').classList.add('hidden');
            const resView = document.getElementById('results');
            resView.classList.remove('hidden');

            const percent = (score / questions.length) * 100;
            document.getElementById('result-percent').innerText = percent + "%";
            
            const resText = document.getElementById('result-text');
            const tryAgainMsg = document.getElementById('try-again-message');

            if (percent >= 90) {
                document.getElementById('result-title').innerText = "🌟 RECOUNT MASTER!";
                resText.innerText = "Fantastic! You really understand how to retell a story. Enjoy the fireworks!";
                tryAgainMsg.classList.add('hidden');
                startFireworks();
            } else {
                document.getElementById('result-title').innerText = "Almost There!";
                resText.innerText = "You're getting the hang of recounts, but the fireworks are locked!";
                tryAgainMsg.classList.remove('hidden');
            }
        }

        function restartGame() {
            currentQIndex = 0;
            score = 0;
            scoreDisp.innerText = "0";
            document.getElementById('results').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('sixty-seven-display').style.display = 'none';
            document.getElementById('ai-feedback-container').classList.add('hidden');
            document.getElementById('ai-feedback-btn').disabled = false;
            stopFireworks();
            loadQuestion();
        }

        // --- FIREWORKS ENGINE ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.alpha = 1;
                this.friction = 0.95;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.01;
            }
        }

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height / 2);
            const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (Math.random() < 0.1) createFirework();

            particles.forEach((p, i) => {
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    p.update();
                    p.draw();
                }
            });
            animationId = requestAnimationFrame(animate);
        }

        function startFireworks() { 
            document.getElementById('sixty-seven-display').style.display = 'block';
            animate(); 
        }
        
        function stopFireworks() {
            if (animationId) cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
        }

        // Init
        loadQuestion();
    </script>
</body>
</html>
